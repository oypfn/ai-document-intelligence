[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "Secure document ingestion and text extraction API, designed for AI-assisted search."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "python-multipart>=0.0.9", "pypdf>=7.0.0,<8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
